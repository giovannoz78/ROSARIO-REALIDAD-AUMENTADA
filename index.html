<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>XII Activaciones · AR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
<script src="activaciones.js"></script>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:transparent;font-family:Georgia,serif}
  #start{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
    background:#000;color:#f3dfb4;letter-spacing:.3em;font-size:14px;cursor:pointer}
  #sonando{position:fixed;left:0;right:0;bottom:48px;z-index:9;text-align:center;color:#f3dfb4;letter-spacing:.3em;font-size:14px;opacity:0;transition:opacity .4s;pointer-events:none;text-shadow:0 0 8px #000}
  #start img{width:min(70vw,360px);height:auto;display:block}
</style>
</head>
<body>
<div id="start">
  <span>TOCAR PARA ENTRAR</span>
  <img src="rosario.png" alt="Rosario">
</div>

<div id="sonando"></div>

<a-scene id="scene" mindar-image="imageTargetSrc: targets.mind; autoStart: false; maxTrack: 1; uiScanning: yes; uiLoading: yes; filterMinCF: 0.0001; filterBeta: 0.001"
  color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">
  <a-assets id="assets"></a-assets>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity light="type: ambient; intensity: 0.35; color: #fff4e0"></a-entity>
  <a-entity light="type: directional; intensity: 0.7; color: #ffd9a0" position="-1 1.2 0.6"></a-entity>
</a-scene>

<script>
// Un archivo de audio por activación, en el mismo orden que los triggers (I a XII)
const AUDIOS = Array.from({length: 12}, (_, i) => `audio/activacion_${String(i + 1).padStart(2, '0')}.mp3`);
const REANUDAR = true;   // true: retoma donde quedó; false: arranca de cero cada vez
const FADE = 900;        // ms de fundido de entrada y salida (imagen y sonido)

// Modelos 3D por activación. Las que no tienen GLB todavía usan su animación de partículas.
// Videos por activación: se reproducen dentro del rosetón (tienen prioridad sobre el GLB).
const VIDEOS = {
  2: { src: 'videos/activacion_02.mp4', sonido: true },   // sonido: true usa el audio original del video
  3: { src: 'videos/activacion_03.mp4', sonido: true },
};
const MODELOS = {
  1: { src: 'modelos/activacion_01.glb', position: '0 0 0', scale: '1 1 1' },
};

const scene = document.getElementById('scene');
const videos = [];
// soporte que copia la posición del rosetón mientras se ve, y se queda quieto al perderlo (para el fundido de salida)
AFRAME.registerComponent('seguir', {
  schema: { type: 'string' },
  init() { this.el.object3D.matrixAutoUpdate = false; this.el.object3D.visible = false; },
  tick() {
    if (!this.ancla) this.ancla = document.getElementById(this.data);
    const a = this.ancla && this.ancla.object3D;
    if (a && a.visible) { this.el.object3D.matrix.copy(a.matrixWorld); this.el.object3D.matrixWorldNeedsUpdate = true; }
  },
});

// fundido de la imagen del video (opacidad del disco y del filo dorado)
function fundir(v, hacia, alTerminar) {
  cancelAnimationFrame(v._raf);
  const mats = (v._capas || []).map(c => c.getObject3D('mesh')).filter(Boolean).map(m => m.material);
  const desde = mats.length ? mats[0].opacity : 0, t0 = performance.now();
  const paso = (t) => {
    const k = Math.min(1, (t - t0) / FADE), e = k * k * (3 - 2 * k);
    mats.forEach(m => { m.opacity = desde + (hacia - desde) * e; });
    if (k < 1) v._raf = requestAnimationFrame(paso); else if (alTerminar) alTerminar();
  };
  v._raf = requestAnimationFrame(paso);
}
function apagarVideo(v) {
  if (!v._g) { v.pause(); return; }
  const t = AC.currentTime; v._g.gain.cancelScheduledValues(t); v._g.gain.setValueAtTime(v._g.gain.value, t);
  v._g.gain.linearRampToValueAtTime(0, t + FADE / 1000); clearTimeout(v._fin); v._fin = setTimeout(() => { if (v._g.gain.value < 0.01) v.pause(); }, FADE + 80);
}
const NUM = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
const sonando = document.getElementById('sonando');
// Web Audio: en iOS es la única forma de controlar el volumen y de que nada suene antes de tiempo
const AC = new (window.AudioContext || window.webkitAudioContext)();
const buffers = new Array(12).fill(null);
AUDIOS.forEach((src, i) => fetch(src).then(r => r.ok ? r.arrayBuffer() : Promise.reject())
  .then(ab => new Promise((ok, ko) => AC.decodeAudioData(ab, ok, ko))).then(b => { buffers[i] = b; }).catch(() => {}));
const voz = Array.from({ length: 12 }, () => ({ src: null, gain: null, offset: 0, start: 0 }));

function sonar(i) {
  const v = voz[i], b = buffers[i];
  if (!b || v.src) return;
  if (AC.state !== 'running') AC.resume();
  const g = AC.createGain(); g.gain.setValueAtTime(0, AC.currentTime); g.gain.linearRampToValueAtTime(1, AC.currentTime + FADE / 1000);
  g.connect(AC.destination);
  const s = AC.createBufferSource(); s.buffer = b; s.connect(g);
  const off = REANUDAR ? v.offset % b.duration : 0;
  s.start(0, off); v.src = s; v.gain = g; v.start = AC.currentTime - off;
  s.onended = () => { if (v.src === s) { v.src = null; v.offset = 0; sonando.style.opacity = 0; } };
  sonando.textContent = '♪  ' + NUM[i]; sonando.style.opacity = 1;
}
function callar(i) {
  const v = voz[i]; if (!v.src) return;
  const s = v.src, g = v.gain; v.src = null; v.offset = AC.currentTime - v.start;
  g.gain.cancelScheduledValues(AC.currentTime); g.gain.setValueAtTime(g.gain.value, AC.currentTime);
  g.gain.linearRampToValueAtTime(0, AC.currentTime + FADE / 1000); s.stop(AC.currentTime + FADE / 1000 + 0.05);
  sonando.style.opacity = 0;
}

// Crea una entidad por target y le cuelga play/pause
for (let i = 0; i < 12; i++) {
  const e = document.createElement('a-entity');
  e.setAttribute('mindar-image-target', `targetIndex: ${i}`); e.id = 'ancla' + i;
  const anim = document.createElement('a-entity');
  const V = VIDEOS[i + 1];
  const M = V ? null : MODELOS[i + 1];
  let vid = null;
  if (V) {
    vid = document.createElement('video');
    vid.id = 'vid' + (i + 1); vid.src = V.src; vid.loop = true; vid.muted = !V.sonido;
    vid.setAttribute('playsinline', ''); vid.setAttribute('webkit-playsinline', ''); vid.preload = 'auto'; vid.crossOrigin = 'anonymous';
    document.getElementById('assets').appendChild(vid); videos.push(vid);
    if (V.sonido) { // el sonido del video pasa por un control de volumen: silencio hasta que aparece el rosetón
      vid._g = AC.createGain(); vid._g.gain.value = 0;
      AC.createMediaElementSource(vid).connect(vid._g); vid._g.connect(AC.destination);
    }
    const disco = document.createElement('a-circle');
    disco.setAttribute('radius', '0.43'); disco.setAttribute('segments', '96');
    disco.setAttribute('material', `shader: flat; src: #vid${i + 1}; transparent: true; opacity: 0`);
    disco.setAttribute('position', '0 0 0.01');
    anim.appendChild(disco);
    const filo = document.createElement('a-ring');
    filo.setAttribute('radius-inner', '0.43'); filo.setAttribute('radius-outer', '0.445'); filo.setAttribute('segments-theta', '96');
    filo.setAttribute('material', 'shader: flat; color: #d8b878; transparent: true; opacity: 0'); filo.setAttribute('position', '0 0 0.011');
    anim.appendChild(filo);
    vid._capas = [disco, filo];
    vid._soporte = document.createElement('a-entity'); vid._soporte.setAttribute('seguir', 'ancla' + i);
    vid._soporte.appendChild(anim); scene.appendChild(vid._soporte);
  } else if (M) {
    anim.setAttribute('gltf-model', M.src);
    anim.setAttribute('position', M.position);
    anim.setAttribute('scale', M.scale);
  } else {
    anim.setAttribute('activacion', `tipo: ${i + 1}`);
  }
  if (!V) e.appendChild(anim);
  e.addEventListener('targetFound', () => {
    for (let j = 0; j < 12; j++) if (j !== i) callar(j);
    videos.forEach(v => { if (v !== vid && !v.paused) apagarVideo(v); });
    if (vid && V.sonido) { if (AC.state !== 'running') AC.resume(); sonando.textContent = '♪  ' + NUM[i]; sonando.style.opacity = 1; }
    else sonar(i);
    if (vid) {
      clearTimeout(vid._fin); vid._soporte.object3D.visible = true;
      vid.currentTime = 0; vid.play().catch(() => {}); fundir(vid, 1);
      if (vid._g) { const t = AC.currentTime; vid._g.gain.cancelScheduledValues(t); vid._g.gain.setValueAtTime(0, t); vid._g.gain.linearRampToValueAtTime(1, t + FADE / 1000); }
    }
    if (M) { // reinicia la animación del GLB cada vez que aparece el rosetón
      anim.removeAttribute('animation-mixer');
      anim.setAttribute('animation-mixer', M.loop ? 'clip: *; loop: repeat' : 'clip: *; loop: once; clampWhenFinished: true');
    }
  });
  e.addEventListener('targetLost', () => {
    callar(i);
    if (vid) {
      apagarVideo(vid); sonando.style.opacity = 0;
      fundir(vid, 0, () => { vid._soporte.object3D.visible = false; });   // se desvanece en su última posición
    }
  });
  scene.appendChild(e);
}

// iOS/Android exigen un toque para habilitar el audio
document.getElementById('start').addEventListener('click', (ev) => {
  ev.currentTarget.remove();
  // desbloquea el audio en iOS con un sonido vacío: no suena nada
  AC.resume(); const q = AC.createBufferSource(); q.buffer = AC.createBuffer(1, 1, 22050); q.connect(AC.destination); q.start(0);
  // los videos se preparan con el mismo toque; los que tienen sonido quedan en volumen 0 hasta su rosetón
  videos.forEach(v => { const p = v.play(); if (p) p.then(() => v.pause()).catch(() => {}); });
  const go = () => scene.systems['mindar-image-system'].start();
  scene.hasLoaded ? go() : scene.addEventListener('loaded', go);
}, { once: true });
</script>
</body>
</html>
